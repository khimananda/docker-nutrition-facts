name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test against a real image
        run: go run ./cmd/docker-nutrition alpine:3.20 --format plain
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
