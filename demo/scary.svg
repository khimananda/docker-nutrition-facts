<svg xmlns="http://www.w3.org/2000/svg" width="380" height="521" viewBox="0 0 380 521" font-family="Helvetica, Arial, sans-serif">
  <title>Nutrition Facts for nutrition-demo:scary</title>
  <rect x="1" y="1" width="378" height="519" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="12" y="46" text-anchor="start" font-weight="900" font-size="36" fill="#000">Nutrition Facts</text>
  <text x="12" y="72" text-anchor="start" font-weight="400" font-size="14" fill="#000">nutrition-demo:scary  (linux/amd64)</text>
  <text x="12" y="94" text-anchor="start" font-weight="400" font-size="14" fill="#000">Serving size 1 container</text>
  <rect x="12" y="100" width="356" height="8" fill="#000"/>
  <text x="12" y="126" text-anchor="start" font-weight="700" font-size="12" fill="#000">Amount per serving</text>
  <text x="368" y="126" text-anchor="end" font-weight="700" font-size="12" fill="#000">% Daily Value</text>
  <rect x="12" y="132" width="356" height="1" fill="#000"/>
  <text x="12" y="155" text-anchor="start" font-weight="700" font-size="14" fill="#000">Calories (uncompressed)</text>
  <text x="310" y="155" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">115.1 MB</text>
  <text x="368" y="155" text-anchor="end" font-weight="700" font-size="14" fill="#000">115%</text>
  <rect x="12" y="160" width="356" height="1" fill="#000"/>
  <text x="12" y="178" text-anchor="start" font-weight="700" font-size="14" fill="#000">Total Layers</text>
  <text x="310" y="178" text-anchor="end" font-weight="400" font-size="14" fill="#000">5</text>
  <text x="368" y="178" text-anchor="end" font-weight="700" font-size="14" fill="#000">33%</text>
  <rect x="12" y="183" width="356" height="1" fill="#000"/>
  <text x="28" y="201" text-anchor="start" font-weight="400" font-size="14" fill="#000">Metadata-only steps</text>
  <text x="310" y="201" text-anchor="end" font-weight="400" font-size="14" fill="#000">7</text>
  <text x="368" y="201" text-anchor="end" font-weight="700" font-size="14" fill="#000"></text>
  <rect x="12" y="206" width="356" height="1" fill="#000"/>
  <text x="12" y="224" text-anchor="start" font-weight="700" font-size="14" fill="#000">Saturated Fat (pkg cache)</text>
  <text x="310" y="224" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">1 layer</text>
  <text x="368" y="224" text-anchor="end" font-weight="700" font-size="14" fill="#000">50%</text>
  <rect x="12" y="229" width="356" height="1" fill="#000"/>
  <text x="12" y="247" text-anchor="start" font-weight="700" font-size="14" fill="#000">Trans Fat (curl | sh)</text>
  <text x="310" y="247" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">1 step</text>
  <text x="368" y="247" text-anchor="end" font-weight="700" font-size="14" fill="#000">50%</text>
  <rect x="12" y="252" width="356" height="1" fill="#000"/>
  <text x="12" y="270" text-anchor="start" font-weight="700" font-size="14" fill="#000">Sodium (secret-ish ENV)</text>
  <text x="310" y="270" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">2 vars</text>
  <text x="368" y="270" text-anchor="end" font-weight="700" font-size="14" fill="#000">100%</text>
  <rect x="12" y="275" width="356" height="1" fill="#000"/>
  <text x="12" y="293" text-anchor="start" font-weight="700" font-size="14" fill="#000">Sugar (unpinned installs)</text>
  <text x="310" y="293" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">2 cmds</text>
  <text x="368" y="293" text-anchor="end" font-weight="700" font-size="14" fill="#000">100%</text>
  <rect x="12" y="298" width="356" height="1" fill="#000"/>
  <text x="12" y="316" text-anchor="start" font-weight="700" font-size="14" fill="#000">Protein (HEALTHCHECK)</text>
  <text x="310" y="316" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">none</text>
  <text x="368" y="316" text-anchor="end" font-weight="700" font-size="14" fill="#000">0%</text>
  <rect x="12" y="321" width="356" height="1" fill="#000"/>
  <rect x="12" y="323" width="356" height="8" fill="#000"/>
  <text x="12" y="353" text-anchor="start" font-weight="400" font-size="14" fill="#000">Runs as root</text>
  <text x="310" y="353" text-anchor="end" font-weight="400" font-size="14" fill="#c1121f">YES</text>
  <text x="368" y="353" text-anchor="end" font-weight="700" font-size="14" fill="#000"></text>
  <rect x="12" y="358" width="356" height="1" fill="#000"/>
  <text x="12" y="376" text-anchor="start" font-weight="400" font-size="14" fill="#000">Base image</text>
  <text x="310" y="376" text-anchor="end" font-weight="400" font-size="14" fill="#000">unknown</text>
  <text x="368" y="376" text-anchor="end" font-weight="700" font-size="14" fill="#000"></text>
  <rect x="12" y="381" width="356" height="1" fill="#000"/>
  <text x="12" y="399" text-anchor="start" font-weight="400" font-size="14" fill="#000">Best before</text>
  <text x="310" y="399" text-anchor="end" font-weight="400" font-size="14" fill="#000">built today</text>
  <text x="368" y="399" text-anchor="end" font-weight="700" font-size="14" fill="#000"></text>
  <rect x="12" y="404" width="356" height="1" fill="#000"/>
  <rect x="12" y="406" width="356" height="8" fill="#000"/>
  <text x="12" y="434" text-anchor="start" font-weight="700" font-size="13" fill="#c1121f">CONTAINS: root, curl | sh, sudo, sshd</text>
  <text x="12" y="460" text-anchor="start" font-weight="900" font-size="22" fill="#c1121f">Grade: F</text>
  <text x="368" y="460" text-anchor="end" font-weight="700" font-size="14" fill="#000">20/100</text>
  <rect x="12" y="468" width="356" height="1" fill="#000"/>
  <text x="12" y="489" text-anchor="start" font-weight="400" font-size="11" fill="#000">* Daily values based on a 100 MB diet.</text>
  <text x="12" y="505" text-anchor="start" font-weight="400" font-size="11" fill="#000">* Serving suggestion: run with --read-only.</text>
</svg>
